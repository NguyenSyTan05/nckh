services:
  ai-service:
    build: ./ai-service
    environment:
      MODEL_MODE: ${MODEL_MODE:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_ACCURATE_MODEL: ${WHISPER_ACCURATE_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
      WHISPER_NUM_WORKERS: ${WHISPER_NUM_WORKERS:-3}
      WHISPER_ACCURATE_WORKERS: ${WHISPER_ACCURATE_WORKERS:-1}
      WHISPER_ACCURATE_THREADS: ${WHISPER_ACCURATE_THREADS:-8}
      CLASSBRIDGE_OPENBLAS_THREADS: ${CLASSBRIDGE_OPENBLAS_THREADS:-1}
      CLASSBRIDGE_OMP_THREADS: ${CLASSBRIDGE_OMP_THREADS:-4}
      CLASSBRIDGE_MKL_THREADS: ${CLASSBRIDGE_MKL_THREADS:-4}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-2}
      WHISPER_MUSIC_BEAM_SIZE: ${WHISPER_MUSIC_BEAM_SIZE:-1}
      WHISPER_ACCURATE_BEAM_SIZE: ${WHISPER_ACCURATE_BEAM_SIZE:-3}
      WHISPER_RETRY_CONFIDENCE: ${WHISPER_RETRY_CONFIDENCE:-0.38}
      WHISPER_VI_RETRY_CONFIDENCE: ${WHISPER_VI_RETRY_CONFIDENCE:-0.44}
      WHISPER_WARMUP: ${WHISPER_WARMUP:-true}
      SPEAKER_SIMILARITY_THRESHOLD: ${SPEAKER_SIMILARITY_THRESHOLD:-0.88}
      SPEAKER_CONTINUITY_THRESHOLD: ${SPEAKER_CONTINUITY_THRESHOLD:-0.80}
      MAX_SPEAKERS_PER_SESSION: ${MAX_SPEAKERS_PER_SESSION:-8}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-VietAI/envit5-translation}
      TRANSLATION_CPU_THREADS: ${TRANSLATION_CPU_THREADS:-8}
      TRANSLATION_NUM_BEAMS: ${TRANSLATION_NUM_BEAMS:-1}
      TRANSLATION_MAX_NEW_TOKENS: ${TRANSLATION_MAX_NEW_TOKENS:-96}
      TRANSLATION_QUANTIZATION: ${TRANSLATION_QUANTIZATION:-int8}
      CORRECTION_MEMORY_PATH: ${CORRECTION_MEMORY_PATH:-/app/correction-memory.json}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-6}
    ports:
      - "8000:8000"

  web:
    build: .
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "3000:3000"
    depends_on:
      - ai-service

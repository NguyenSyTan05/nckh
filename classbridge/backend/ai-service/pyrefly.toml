# Pyrefly config — classbridge/ai-service
# Dùng Python venv nội bộ của dự án

python_interpreter = ".venv/Scripts/python.exe"
python_version = "3.11"
search_path = [".venv/Lib/site-packages", ".", "../training"]

project-includes = ["."]
project-excludes = [
  ".venv/**",
  "__pycache__/**",
  ".models/**",
  "tests/**",
  "**/__pyrefly_virtual__/**",
  "**/inmemory/**",
]

[errors]
missing-import = false
bad-argument-type = false
bad-return-type = false
bad-assignment = false
missing-attribute = false
not-callable = false
invalid-argument = false
undefined-name = false
unknown-name = false
parse-error = false
invalid-syntax = false
missing-return = false
bad-specialization = false
unsupported-operand = false
deprecated = false
unnecessary-type-conversion = false
import-cycle = false
unbound-import = false
unused-ignore = false

# Pyrefly config — classbridge/training
# Dùng Python venv của ai-service

python_interpreter = "../backend/ai-service/.venv/Scripts/python.exe"
python_version = "3.11"
search_path = [
  "../backend/ai-service/.venv/Lib/site-packages",
  "../backend/ai-service",
  ".",
]

project-includes = ["."]
project-excludes = [
  "__pycache__/**",
  "custom_voice_samples/**",
  "**/__pyrefly_virtual__/**",
  "**/inmemory/**",
]

[errors]
missing-import = false
bad-argument-type = false
bad-return-type = false
bad-assignment = false
missing-attribute = false
not-callable = false
invalid-argument = false
undefined-name = false
unknown-name = false
parse-error = false
invalid-syntax = false
missing-return = false
bad-specialization = false
unsupported-operand = false
deprecated = false
unnecessary-type-conversion = false
import-cycle = false
unbound-import = false
unused-ignore = false
